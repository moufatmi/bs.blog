name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The programs feed URL. Astro bakes PUBLIC_* variables into the pages at
    # build time, so this job needs it. GitHub Pages has no .env file.
    #
    # It works out of the box thanks to the fallback URL below. To change it
    # later, set a repository variable instead of editing this file:
    #   Settings -> Secrets and variables -> Actions -> Variables
    #   name:  PUBLIC_PROGRAMS_FEED_URL
    #   value: https://script.google.com/macros/s/XXXX/exec
    #
    # This is not a secret: the URL is readable by anyone who opens the page.
    env:
      PUBLIC_PROGRAMS_FEED_URL: ${{ vars.PUBLIC_PROGRAMS_FEED_URL || 'https://script.google.com/macros/s/AKfycbzD3ToaZu8x7Sak4btiVw9RHxbFWCFjWSvwfWBLjr-uoCvgB25yBnqy8mlspl9KT-PAkA/exec' }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
          package-manager: npm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
